<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wizard Duel VR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  body{margin:0;background:#0b0818;font-family:Georgia,serif}
  #auth{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#0b0818ee;color:#eee}
  #auth div{background:#1c1538;padding:28px;border-radius:12px;width:290px;text-align:center;border:1px solid #6a4fd8}
  #auth input,#auth button{width:100%;box-sizing:border-box;margin:5px 0;padding:10px;border-radius:6px;border:0;font-size:15px}
  #auth button{background:#6a4fd8;color:#fff;cursor:pointer}
  #auth button.alt{background:#3a3068}
  #err{color:#ff8a8a;font-size:13px;min-height:16px}
</style>
</head>
<body>
<div id="auth"><div>
  <h2>Wizard Duel VR</h2>
  <input id="em" type="email" placeholder="Email">
  <input id="pw" type="password" placeholder="Password (6+ chars)">
  <button id="login">Log in</button>
  <button id="signup" class="alt">Create account</button>
  <button id="guest" class="alt">Play offline (saves in this browser)</button>
  <div id="err" style="padding:0;border:0;background:none;width:auto"></div>
</div></div>

<a-scene id="scene" game cursor="rayOrigin:mouse" raycaster="objects:.btn" fog="type:exponential;color:#0b0818;density:0.03" renderer="colorManagement:true">
  <a-sky color="#0b0818"></a-sky>
  <a-light type="ambient" color="#8070c0" intensity="0.7"></a-light>
  <a-light type="point" color="#ffd9a0" intensity="0.8" position="0 6 0"></a-light>
  <a-circle rotation="-90 0 0" radius="30" color="#2a2640"></a-circle>
  <a-entity id="pillars"></a-entity>
  <a-entity id="world"></a-entity>
  <a-entity id="rig">
    <a-entity id="cam" camera look-controls wasd-controls="acceleration:30" position="0 1.6 0">
      <a-circle id="sh" radius="0.5" position="0 0 -0.8" material="color:#66ff99;opacity:0.25;transparent:true" visible="false"></a-circle>
      <a-entity id="hud" position="0 -0.3 -1" text="value:;align:center;width:1.6;color:#fff"></a-entity>
      <a-entity id="msg" position="0 0.38 -1" text="value:;align:center;width:1.5;color:#ffe066"></a-entity>
    </a-entity>
    <a-entity id="rh" laser-controls="hand:right" raycaster="objects:.btn;far:8"></a-entity>
  </a-entity>
</a-scene>

<script>
if (typeof AFRAME === 'undefined') { document.getElementById('err').textContent = 'A-Frame failed to load. Check your internet connection or ad blocker.'; throw new Error('A-Frame missing'); }
/* ---------- FIREBASE: paste your config from Firebase console > Project settings ---------- */
const cfg = { apiKey:"YOUR_API_KEY", authDomain:"YOUR_PROJECT.firebaseapp.com", projectId:"YOUR_PROJECT", appId:"YOUR_APP_ID" };
const FB = cfg.apiKey !== "YOUR_API_KEY";
let auth, db;
if (FB) { firebase.initializeApp(cfg); auth = firebase.auth(); db = firebase.firestore(); }

/* ---------- SPELLS (original names; price 0 = taught in tutorial) ---------- */
const SP = {
  lumi:{n:'Lumivex', c:'#ffe066', dmg:12, cd:.5, price:0},
  repu:{n:'Repulso', c:'#66ccff', dmg:6, push:2.5, stun:1.5, cd:1, price:0},
  aegi:{n:'Aegisol', c:'#66ff99', shield:2, cd:4, price:0},
  igni:{n:'Ignivar', c:'#ff6a1a', dmg:30, cd:1.2, price:120},
  glac:{n:'Glaciora', c:'#9be7ff', dmg:18, stun:3, cd:.8, price:200},
  tene:{n:'Tenebris Nova', c:'#a64dff', dmg:55, cd:2.5, price:300}
};
Object.keys(SP).forEach(k => SP[k].id = k);

/* ---------- STATE ---------- */
let U = null, S = {gold:0, spells:[], tutorialDone:false, wins:0};
let mode = 'menu', cur = 0, enemies = [], shots = [], hp = 100, shield = 0, step = 0, wave = 1, cd = {}, hudT = 0;
const $ = id => document.getElementById(id);
const scene = $('scene'), cam = $('cam'), rh = $('rh'), world = $('world'), sh = $('sh');

/* ---------- ACCOUNTS + SAVING ---------- */
let st;
function save() {
  clearTimeout(st);
  st = setTimeout(() => {
    try {
      if (FB && U) db.collection('users').doc(U.uid).set(S);
      else localStorage.setItem('wizardduel', JSON.stringify(S));
    } catch (e) { console.warn(e); }
  }, 400);
}
async function load() {
  try {
    if (FB && U) { const d = await db.collection('users').doc(U.uid).get(); if (d.exists) S = Object.assign(S, d.data()); }
    else { const j = localStorage.getItem('wizardduel'); if (j) S = Object.assign(S, JSON.parse(j)); }
  } catch (e) { console.warn(e); }
}
function authGo(m) {
  if (!FB) { $('err').textContent = 'Add your Firebase config first (or play offline).'; return; }
  auth[m]($('em').value, $('pw').value).catch(e => $('err').textContent = e.message);
}
$('login').onclick = () => authGo('signInWithEmailAndPassword');
$('signup').onclick = () => authGo('createUserWithEmailAndPassword');
$('guest').onclick = () => begin();
if (FB) auth.onAuthStateChanged(u => { if (u && !U) { U = u; begin(); } });
async function begin() {
  await load();
  $('auth').style.display = 'none';
  S.tutorialDone ? hub() : tutorial();
}

/* ---------- ENVIRONMENT ---------- */
for (let i = 0; i < 10; i++) {
  const a = i / 10 * Math.PI * 2, p = document.createElement('a-cylinder');
  p.setAttribute('radius', .6); p.setAttribute('height', 8); p.setAttribute('color', '#3d3560');
  p.setAttribute('position', `${Math.cos(a) * 14} 4 ${Math.sin(a) * 14}`);
  $('pillars').appendChild(p);
}

/* ---------- UI HELPERS ---------- */
function say(t) { $('msg').setAttribute('text', 'value', t); }
function updHud() {
  const s = S.spells.map((id, i) => (i === cur ? '[' + SP[id].n + ']' : SP[id].n)).join('  ');
  $('hud').setAttribute('text', 'value', `HP ${Math.max(0, Math.ceil(hp))}   Gold ${S.gold}\n${s}`);
}
function txt(v, x, y, w, col) {
  const e = document.createElement('a-entity');
  e.setAttribute('text', {value:v, align:'center', width:w, color:col || '#fff'});
  e.setAttribute('position', `${x} ${y} 0`); return e;
}
function btn(v, x, y, fn, col) {
  const e = document.createElement('a-entity');
  e.setAttribute('geometry', {primitive:'plane', width:2.6, height:.28});
  e.setAttribute('material', {color:col || '#3a2f78'});
  e.setAttribute('text', {value:v, align:'center', width:2.5, color:'#fff'});
  e.setAttribute('position', `${x} ${y} 0.01`); e.classList.add('btn');
  e.addEventListener('click', fn); return e;
}
function clear() {
  while (world.firstChild) world.removeChild(world.firstChild);
  shots.forEach(s => s.el.remove()); shots = []; enemies = [];
  shield = 0; sh.setAttribute('visible', false);
}

/* ---------- HUB + SPELLBOOK SHOP ---------- */
function hub() {
  mode = 'hub'; clear(); hp = 100; say('');
  const g = document.createElement('a-entity');
  g.setAttribute('position', '0 1.7 -3'); world.appendChild(g);
  g.appendChild(txt('WIZARD DUEL', 0, 1.1, 3, '#ffe066'));
  g.appendChild(btn(`Start duel (wave ${S.wins + 1})`, 0, .7, startFight, '#a02020'));
  g.appendChild(txt('Spellbook shop', 0, .35, 2, '#b9a8ff'));
  let row = 0;
  Object.values(SP).filter(s => s.price > 0).forEach(s => {
    const owned = S.spells.includes(s.id);
    g.appendChild(owned ? txt(s.n + ' (learned)', 0, .05 - row * .33, 2, '#7f7') :
      btn(`Buy ${s.n} - ${s.price} gold`, 0, .05 - row * .33, () => {
        if (S.gold >= s.price) { S.gold -= s.price; S.spells.push(s.id); save(); hub(); say('Learned ' + s.n + '!'); }
        else say('Not enough gold - win more duels!');
      }));
    row++;
  });
  if (FB && U) g.appendChild(btn('Log out', 0, -1.2, () => auth.signOut().then(() => location.reload()), '#444'));
  updHud();
}

/* ---------- TUTORIAL ---------- */
const TUT = [
  ['Welcome, apprentice! Aim at the dummy and cast Lumivex (click / trigger).', 'lumi'],
  ['Well done! Press 2 (or grip) to switch to Repulso and blast the dummy.', 'repu'],
  ['Last lesson: press 3 / grip for Aegisol, then cast it to raise a shield.', 'aegi']
];
function dummy() {
  const e = makeEnemy(0, -6, 9999, true); enemies.push(e);
}
function tutorial() {
  mode = 'tutorial'; step = 0; clear(); dummy(); hp = 100; teach();
}
function teach() {
  const id = TUT[step][1];
  if (!S.spells.includes(id)) S.spells.push(id);
  cur = S.spells.indexOf(id); say(TUT[step][0]); save(); updHud();
}
function adv() {
  step++;
  if (step >= TUT.length) {
    S.tutorialDone = true; save(); mode = 'after';
    say('Tutorial complete! Duel to earn gold, then buy spellbooks.'); setTimeout(hub, 3000);
  } else teach();
}

/* ---------- COMBAT ---------- */
function makeEnemy(x, z, hpMax, isDummy) {
  const el = document.createElement('a-entity');
  el.innerHTML = `<a-cone radius-bottom="0.5" radius-top="0.15" height="1.6" position="0 -0.2 0" color="${isDummy ? '#8a6a3a' : '#2a1a3a'}"></a-cone>
    <a-sphere radius="0.2" position="0 0.75 0" color="${isDummy ? '#c9a66b' : '#d9b99b'}"></a-sphere>
    <a-plane class="bar" width="0.8" height="0.08" position="0 1.2 0" color="#e33"></a-plane>`;
  world.appendChild(el);
  const e = {el, pos:new THREE.Vector3(x, 1, z), hp:hpMax, max:hpMax, cool:2 + Math.random() * 2, stun:0, dummy:isDummy};
  el.object3D.position.copy(e.pos); return e;
}
function startFight() {
  mode = 'fight'; clear(); hp = 100; wave = S.wins + 1;
  const n = Math.min(1 + Math.floor(wave / 2), 4);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    enemies.push(makeEnemy(Math.cos(a) * 9, Math.sin(a) * 9 - 2, 30 + wave * 10, false));
  }
  say(`Wave ${wave}: ${n} dark wizard${n > 1 ? 's' : ''}!`); updHud();
}
function aim() {
  const src = scene.is('vr-mode') ? rh.object3D : cam.object3D;
  const p = new THREE.Vector3(), q = new THREE.Quaternion(), d = new THREE.Vector3(0, 0, -1);
  src.getWorldPosition(p); src.getWorldQuaternion(q); d.applyQuaternion(q);
  return {p, d};
}
function bolt(p, d, color, mine, sp, dmg) {
  const el = document.createElement('a-sphere');
  el.setAttribute('radius', .12); el.setAttribute('color', color);
  el.setAttribute('material', {color, emissive:color, emissiveIntensity:1});
  scene.appendChild(el);
  shots.push({el, p:p.clone(), d:d.clone(), mine, sp, dmg, life:3});
}
function cast() {
  if (mode !== 'fight' && mode !== 'tutorial') return;
  const id = S.spells[cur]; if (!id) return;
  const sp = SP[id], now = performance.now();
  if ((cd[id] || 0) > now) return;
  cd[id] = now + sp.cd * 1000;
  if (sp.shield) {
    shield = sp.shield; sh.setAttribute('visible', true);
    if (mode === 'tutorial' && step === 2) adv();
    return;
  }
  const {p, d} = aim(); bolt(p, d, sp.c, true, sp);
}
function hit(e, sp) {
  e.hp -= sp.dmg || 0;
  if (sp.push) {
    const away = e.pos.clone(); away.y = 0; if (away.length() < .01) away.set(0, 0, -1);
    e.pos.addScaledVector(away.normalize(), sp.push);
  }
  if (sp.stun) e.stun = sp.stun;
  const bar = e.el.querySelector('.bar');
  if (bar) bar.setAttribute('scale', `${Math.max(e.hp / e.max, 0.001)} 1 1`);
  if (e.hp <= 0) e.el.remove();
  if (mode === 'tutorial' && e.dummy) {
    if (step === 0 && sp.id === 'lumi') adv();
    else if (step === 1 && sp.id === 'repu') adv();
  }
}
function end(won) {
  mode = 'after';
  if (won) {
    const r = enemies.length * 20 + wave * 10;
    S.gold += r; S.wins++; save(); say(`Victory! +${r} gold`);
  } else say('You were defeated... no gold this time.');
  setTimeout(hub, 2800);
}

AFRAME.registerComponent('game', {
  tick(t, dt) {
    dt = Math.min(dt / 1000, .1);
    const hp3 = new THREE.Vector3(); cam.object3D.getWorldPosition(hp3);
    if (shield > 0) { shield -= dt; if (shield <= 0) sh.setAttribute('visible', false); }
    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i]; let kill = false;
      s.p.addScaledVector(s.d, (s.mine ? 18 : 7) * dt);
      s.el.object3D.position.copy(s.p); s.life -= dt; if (s.life <= 0) kill = true;
      if (s.mine) {
        for (const e of enemies) if (e.hp > 0 && s.p.distanceTo(e.pos) < .8) { hit(e, s.sp); kill = true; break; }
      } else if (s.p.distanceTo(hp3) < .6) { if (shield <= 0) hp -= s.dmg; kill = true; }
      if (kill) { s.el.remove(); shots.splice(i, 1); }
    }
    for (const e of enemies) {
      if (e.hp <= 0 || e.dummy) continue;
      if (e.stun > 0) { e.stun -= dt; continue; }
      const to = hp3.clone().sub(e.pos); to.y = 0;
      if (to.length() > 5) e.pos.addScaledVector(to.clone().normalize(), .9 * dt);
      e.el.object3D.position.copy(e.pos); e.el.object3D.rotation.y = Math.atan2(to.x, to.z);
      e.cool -= dt;
      if (e.cool <= 0) {
        e.cool = Math.max(1.2, 2.8 - wave * .08);
        const p = e.pos.clone(); p.y = 1.5;
        bolt(p, hp3.clone().sub(p).normalize(), '#ff3355', false, null, 8 + wave);
      }
    }
    if (mode === 'fight') {
      if (hp <= 0) end(false);
      else if (enemies.every(e => e.hp <= 0)) end(true);
    }
    hudT += dt; if (hudT > .25) { hudT = 0; updHud(); }
  }
});

/* ---------- INPUT ---------- */
scene.addEventListener('mousedown', e => { if (e.button === 0) cast(); });
rh.addEventListener('triggerdown', cast);
rh.addEventListener('gripdown', () => { if (S.spells.length) cur = (cur + 1) % S.spells.length; updHud(); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space') cast();
  const n = parseInt(e.key, 10);
  if (n && S.spells[n - 1]) { cur = n - 1; updHud(); }
});
</script>
</body>
</html>
