<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VR Minigames</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#070a1c;font:15px system-ui,sans-serif;color:#fff}
#ui{position:fixed;left:0;right:0;bottom:4vh;text-align:center;pointer-events:none}
#ui *{pointer-events:auto}
button{font:600 17px system-ui;padding:12px 22px;margin:4px;border:0;border-radius:12px;background:#2a6aff;color:#fff;cursor:pointer}
button:disabled{background:#333;cursor:default}
#h{opacity:.8;margin-bottom:8px;pointer-events:none}
</style></head><body>
<div id="ui"><div id="h">Desktop preview: WASD + drag to look, click to select &middot; VR: left stick move, right stick turn, trigger select, look at your left wrist watch (or press X/Y/menu) for the menu &middot; M on desktop</div><button id="vr" disabled>Enter VR</button><button id="nm">Set name</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const T=THREE,PI=Math.PI,$=id=>document.getElementById(id);
const S={g:(k,d)=>{try{return localStorage.getItem('vrmg_'+k)||d}catch(e){return d}},s:(k,v)=>{try{localStorage.setItem('vrmg_'+k,v)}catch(e){}}};
let myName=(new URLSearchParams(location.search).get('name')||S.g('name','Player'+(100+Math.random()*900|0))).slice(0,14),myColor=+S.g('color',0x3aa0ff);
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.xr.enabled=true;document.body.prepend(R.domElement);
const sc=new T.Scene();sc.fog=new T.Fog(0x070a1c,16,45);
const cam=new T.PerspectiveCamera(70,innerWidth/innerHeight,.05,200),rig=new T.Group();rig.add(cam);sc.add(rig);cam.position.y=1.6;rig.position.z=6.5;
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
const W=new T.Vector3(),Y=new T.Vector3(0,1,0),hits=[];
const MS=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.5,metalness:.2},o)),MB=(c,o)=>new T.MeshBasicMaterial(Object.assign({color:c},o));
const mesh=(g,m,x=0,y=0,z=0,p)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);(p||sc).add(o);return o};
const tex=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return new T.CanvasTexture(c)};
function label(w,h,t,s,fs=64){const c=document.createElement('canvas');c.width=512;c.height=512*h/w|0;const g=c.getContext('2d'),x=new T.CanvasTexture(c),m=new T.Mesh(new T.PlaneGeometry(w,h),MB(0xffffff,{map:x,transparent:true}));
m.userData.set=(a,b,col)=>{g.clearRect(0,0,512,c.height);g.fillStyle='rgba(10,14,40,.88)';g.fillRect(5,5,502,c.height-10);g.strokeStyle=col||'#4cf';g.lineWidth=6;g.strokeRect(5,5,502,c.height-10);g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.font='700 '+fs+'px system-ui';g.fillText(a,256,b?c.height*.4:c.height/2);if(b){g.font='500 '+fs*.55+'px system-ui';g.fillStyle='#9cf';g.fillText(b,256,c.height*.74)}x.needsUpdate=true};m.userData.set(t,s);return m}

/* ---------- LOBBY ---------- */
const skyT=tex(1024,512,(g,w,h)=>{g.fillStyle='#04061a';g.fillRect(0,0,w,h);for(let i=0;i<3;i++){const x=Math.random()*w,y=Math.random()*h,r=g.createRadialGradient(x,y,0,x,y,160);r.addColorStop(0,['#3a1a6a','#103a7a','#6a1a4a'][i]);r.addColorStop(1,'transparent');g.fillStyle=r;g.fillRect(0,0,w,h)}for(let i=0;i<700;i++){g.fillStyle='rgba(255,255,255,'+Math.random()+')';g.fillRect(Math.random()*w,Math.random()*h,1.5,1.5)}});
mesh(new T.SphereGeometry(100,32,16),MB(0xffffff,{map:skyT,side:T.BackSide,fog:false}));
const fT=tex(1024,1024,(g,w)=>{g.fillStyle='#0a0e2c';g.fillRect(0,0,w,w);g.lineWidth=3;for(let r=64;r<=512;r+=64){g.strokeStyle=r%128?'#1d3a9a':'#3a8cff';g.beginPath();g.arc(512,512,r,0,7);g.stroke()}g.strokeStyle='#162a7a';for(let a=0;a<24;a++){const t=a*PI/12;g.beginPath();g.moveTo(512+Math.cos(t)*64,512+Math.sin(t)*64);g.lineTo(512+Math.cos(t)*512,512+Math.sin(t)*512);g.stroke()}});
mesh(new T.CircleGeometry(12,64),MS(0xffffff,{map:fT,emissive:0xffffff,emissiveMap:fT,emissiveIntensity:.6,roughness:.4})).rotation.x=-PI/2;
const wT=tex(2048,256,(g,w,h)=>{g.fillStyle='#101536';g.fillRect(0,0,w,h);g.fillStyle='#1c2a78';for(let x=0;x<w;x+=128)g.fillRect(x,0,4,h);g.fillStyle='#3b8cff';g.fillRect(0,18,w,6);g.fillRect(0,232,w,6)});
mesh(new T.CylinderGeometry(12,12,6,64,1,true),MS(0xffffff,{map:wT,emissive:0xffffff,emissiveMap:wT,emissiveIntensity:.5,side:T.BackSide}),0,3);
mesh(new T.RingGeometry(4.5,12,64),MS(0x0d1230),0,6).rotation.x=PI/2;
[[11.9,.15,0x3b8cff],[11.9,5.85,0x3b8cff],[4.5,5.95,0xb06bff]].forEach(([r,y,c])=>mesh(new T.TorusGeometry(r,.05,8,96),MB(c),0,y).rotation.x=PI/2);
sc.add(new T.HemisphereLight(0x9ab4ff,0x201040,1));const dl=new T.DirectionalLight(0xffffff,.5);dl.position.set(3,8,2);sc.add(dl);
for(let i=0;i<6;i++){const a=(i*60+30)*PI/180;mesh(new T.BoxGeometry(1.8,.4,.5),MS(0x1c2460),Math.sin(a)*4.6,.2,-Math.cos(a)*4.6).rotation.y=-a}
// hub
const hub=new T.Group();sc.add(hub);mesh(new T.CylinderGeometry(1.9,2,.35,40),MS(0x151a44),0,.17,0,hub);mesh(new T.TorusGeometry(1.9,.05,8,48),MB(0x55ccff),0,.36,0,hub).rotation.x=PI/2;
const orb=mesh(new T.IcosahedronGeometry(.55,1),MB(0x55ccff,{wireframe:true}),0,1.8,0,hub);mesh(new T.IcosahedronGeometry(.3,0),MB(0xffffff),0,1.8,0,hub);
const hubL=label(2.6,.7,'MINIGAMES','Pick a portal',58);hubL.position.set(0,3,0);sc.add(hubL);
const pl=new T.PointLight(0x66aaff,1.2,12);pl.position.y=2;sc.add(pl);
// portals (placeholders for the minigames)
const arcs=[];
[['Dodgeball Arena',0xff5577,72],['Target Range',0xffc233,144],['Parkour Run',0x44ee99,-144],['Orb Rush',0xb06bff,-72]].forEach(([n,c,d])=>{
 const a=d*PI/180,g=new T.Group();g.position.set(Math.sin(a)*11.4,0,-Math.cos(a)*11.4);sc.add(g);g.lookAt(0,0,0);
 const fm=MS(0x1a2050,{metalness:.6});[-1,1].forEach(s=>mesh(new T.BoxGeometry(.22,3.4,.3),fm,s*1.2,1.7,0,g));mesh(new T.BoxGeometry(2.62,.22,.3),fm,0,3.4,0,g);
 const pt=tex(64,64,x=>{const r=x.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'#fff');r.addColorStop(.4,'#'+c.toString(16).padStart(6,'0'));r.addColorStop(1,'#000');x.fillStyle=r;x.fillRect(0,0,64,64)});
 const p=mesh(new T.PlaneGeometry(2.16,3.2),MB(0xffffff,{map:pt}),0,1.7,-.05,g);
 [0,1].forEach(i=>arcs.push(mesh(new T.TorusGeometry(.6+i*.3,.03,8,40,PI*1.4),MB(0xffffff),0,1.7,.02,g)));
 mesh(new T.CylinderGeometry(1.5,1.5,.06,32),MS(c,{emissive:c,emissiveIntensity:.5}),0,.03,1.3,g);
 const sg=label(2.4,.6,n,'Coming soon',50);sg.position.set(0,3.9,.1);g.add(sg);let to;
 p.userData.sel=()=>{sg.userData.set(n,'Not built yet!','#ffe066');clearTimeout(to);to=setTimeout(()=>sg.userData.set(n,'Coming soon'),1800)};hits.push(p)});
// avatar station: mirror + color picker
const st=new T.Group();st.position.set(0,0,-11.6);sc.add(st);st.lookAt(0,0,0);
const rt=new T.WebGLRenderTarget(512,333);rt.texture.wrapS=T.RepeatWrapping;rt.texture.repeat.x=-1;rt.texture.offset.x=1;
const mp=mesh(new T.PlaneGeometry(4,2.6),MB(0xffffff,{map:rt.texture}),0,1.75,.06,st);mesh(new T.BoxGeometry(4.3,2.9,.1),MS(0x1a2050,{metalness:.6}),0,1.75,-.02,st);
const nl=label(2.4,.5,myName,'Avatar Station',52);nl.position.set(0,3.5,.1);st.add(nl);
mesh(new T.BoxGeometry(4,.8,.5),MS(0x151a44),0,.4,1.4,st);const cl=label(1.6,.3,'Choose your color',null,40);cl.position.set(0,1.35,1.4);st.add(cl);
const sw=[0x3aa0ff,0xff4d6d,0x2ee6a6,0xffc533,0xb36bff,0xff8a3d,0xf2f2f7].map((c,i)=>{const s=mesh(new T.SphereGeometry(.1,16,12),MB(c),-1.2+i*.4,.98,1.4,st);s.userData.c=c;s.userData.sel=()=>setColor(c);hits.push(s);return s});
const mPos=new T.Vector3(0,1.75,.06);st.updateMatrixWorld();st.localToWorld(mPos);
const mc=new T.PerspectiveCamera(40,4/2.6,.1,100);mc.layers.enable(3);

/* ---------- PLAYER MODEL ---------- */
function avatar(name,color,local){
 const A={g:new T.Group(),by:0},sk=MS(color,{roughness:.45}),tr=MS(0x151a33,{roughness:.4,metalness:.5}),gl=MB(color),V=new T.Vector3(),E=new T.Euler(0,0,0,'YXZ');sc.add(A.g);
 const H=new T.Group(),B=new T.Group();A.g.add(H,B);
 const s0=mesh(new T.SphereGeometry(.125,24,16),sk,0,.03,.07,H);s0.scale.set(1,1.06,1.08);
 mesh(new T.SphereGeometry(.132,24,12,PI*1.5-.95,1.9,PI/2-.42,.75),MS(0x05070f,{roughness:.1,metalness:.9}),0,.03,.07,H).scale.copy(s0.scale);
 [-1,1].forEach(s=>{mesh(new T.SphereGeometry(.014,8,8),MB(0x8ff6ff),s*.042,.045,-.076,H).scale.set(1,1.6,.5);mesh(new T.CylinderGeometry(.035,.035,.03,12),tr,s*.13,.03,.08,H).rotation.z=PI/2});
 mesh(new T.CylinderGeometry(.045,.055,.12,12),tr,0,-.15,.07,H);
 mesh(new T.CylinderGeometry(.17,.12,.38,20),sk,0,-.45,.05,B);mesh(new T.SphereGeometry(.17,16,8),sk,0,-.27,.05,B).scale.set(1.15,.5,.8);
 mesh(new T.CylinderGeometry(.12,.07,.3,16),tr,0,-.78,.05,B);mesh(new T.ConeGeometry(.07,.3,12),sk,0,-1.05,.05,B).rotation.x=PI;
 mesh(new T.TorusGeometry(.125,.012,6,28),gl,0,-.63,.05,B).rotation.x=PI/2;mesh(new T.CircleGeometry(.035,16),gl,0,-.4,-.108,B).rotation.y=PI;
 const hand=()=>{const g=new T.Group();mesh(new T.SphereGeometry(.05,14,10),sk,0,0,0,g).scale.set(1,.7,1.3);mesh(new T.SphereGeometry(.02,8,8),sk,0,.04,-.02,g);mesh(new T.TorusGeometry(.04,.01,6,16),gl,0,0,.075,g);A.g.add(g);return g};
 A.l=hand();A.r=hand();
 if(local){const wc=document.createElement('canvas');wc.width=wc.height=128;const wg=wc.getContext('2d'),wt=new T.CanvasTexture(wc);
  A.clock=()=>{wg.fillStyle='#050816';wg.fillRect(0,0,128,128);wg.strokeStyle='#55ccff';wg.lineWidth=8;wg.strokeRect(4,4,120,120);wg.fillStyle='#fff';wg.font='700 34px system-ui';wg.textAlign='center';wg.textBaseline='middle';wg.fillText(new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),64,64);wt.needsUpdate=true};A.clock();
  mesh(new T.TorusGeometry(.042,.009,6,20),tr,0,0,.11,A.l);mesh(new T.BoxGeometry(.056,.014,.056),tr,0,.046,.11,A.l);
  A.watch=mesh(new T.PlaneGeometry(.046,.046),MB(0xffffff,{map:wt}),0,.054,.11,A.l);A.watch.rotation.x=-PI/2}
 if(local)H.traverse(o=>o.layers.set(3));else{A.tag=label(.7,.16,name,null,56);A.g.add(A.tag)}
 A.col=c=>{sk.color.setHex(c);gl.color.setHex(c)};
 // pose in world space. Send these values over the network later to show friends.
 A.up=(hp,hq,lp,lq,rp,rq,dt)=>{H.position.copy(hp);H.quaternion.copy(hq);E.setFromQuaternion(hq,'YXZ');let d=E.y-A.by;d=Math.atan2(Math.sin(d),Math.cos(d));A.by+=d*Math.min(1,dt*4);B.position.copy(hp);B.rotation.y=A.by;
  [[A.l,lp,lq,-1],[A.r,rp,rq,1]].forEach(([h,p,q,s])=>{if(p){h.position.copy(p);h.quaternion.copy(q)}else{h.position.set(s*.26,-.5,-.15).applyAxisAngle(Y,A.by).add(hp);h.rotation.set(0,A.by,0)}});
  if(A.tag){A.tag.position.set(hp.x,hp.y+.32,hp.z);A.tag.lookAt(cam.getWorldPosition(V))}};
 return A}
const me=avatar(myName,myColor,true);
function setColor(c){myColor=c;S.s('color',c);me.col(c);sw.forEach(s=>s.userData.b=s.userData.c==c?1.35:1)}setColor(myColor);
const bots=[['Alex',0xff4d6d,-3.6,1.5],['Sam',0x2ee6a6,3.6,.5],['Riley',0xffc533,-1.4,-4.2]].map(([n,c,x,z])=>({a:avatar(n,c),x,z}));
$('nm').onclick=()=>{const n=prompt('Your name',myName);if(n){myName=n.slice(0,14);S.s('name',myName);nl.userData.set(myName,'Avatar Station')}};

/* ---------- WRIST MENU (empty frame/base for now) ---------- */
const menu=new T.Group();menu.visible=false;sc.add(menu);
mesh(new T.BoxGeometry(.44,.275,.012),MS(0x1a2050,{metalness:.6}),0,0,0,menu);
const mT=tex(1024,622,(g,w,h)=>{g.fillStyle='#0a0e2c';g.fillRect(0,0,w,h);g.shadowColor='#55ccff';g.shadowBlur=18;g.strokeStyle='#55ccff';g.lineWidth=8;g.strokeRect(14,14,w-28,h-28);g.shadowBlur=0;g.fillStyle='#121a50';g.fillRect(34,34,w-68,72);g.fillStyle='#0d1238';g.fillRect(34,124,w-68,h-158)});
mesh(new T.PlaneGeometry(.42,.255),MB(0xffffff,{map:mT}),0,0,.007,menu);
const wp=new T.Vector3(),wq=new T.Quaternion(),wn=new T.Vector3(),tv=new T.Vector3(),fw=new T.Vector3();let pinned=false,pb=false,gz=0,mk=0;

/* ---------- INPUT ---------- */
const rc=new T.Raycaster(),M4=new T.Matrix4(),dot=mesh(new T.SphereGeometry(.015,8,8),MB(0xffffff));dot.visible=false;let hov=null,snap=0;
const hit=c=>{M4.identity().extractRotation(c.matrixWorld);rc.ray.origin.setFromMatrixPosition(c.matrixWorld);rc.ray.direction.set(0,0,-1).applyMatrix4(M4);return rc.intersectObjects(hits,false)[0]};
function pick(c){const h=hit(c);if(h&&h.object.userData.sel){h.object.userData.sel();try{c.userData.i.gamepad.hapticActuators[0].pulse(.5,60)}catch(e){}}}
const ctl=[0,1].map(i=>{const c=R.xr.getController(i),l=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(),new T.Vector3(0,0,-1)]),new T.LineBasicMaterial({color:0x66ddff}));c.add(l);c.userData.l=l;rig.add(c);
 c.addEventListener('connected',e=>c.userData.i=e.data);c.addEventListener('disconnected',()=>c.userData.i=null);c.addEventListener('selectstart',()=>pick(c));return c});
function mv(x,y,dt){if(!x&&!y)return;cam.getWorldDirection(W);W.y=0;W.normalize();const s=2.4*dt;rig.position.x+=(-W.x*y-W.z*x)*s;rig.position.z+=(-W.z*y+W.x*x)*s}
function turn(a){cam.getWorldPosition(W);const dx=rig.position.x-W.x,dz=rig.position.z-W.z,c=Math.cos(a),s=Math.sin(a);rig.position.x=W.x+dx*c+dz*s;rig.position.z=W.z-dx*s+dz*c;rig.rotation.y+=a}
function bound(){rig.updateMatrixWorld(true);cam.getWorldPosition(W);const r=Math.hypot(W.x,W.z);let k=0;if(r>11)k=11-r;else if(r<2.6)k=2.6-r;if(k){rig.position.x+=(r?W.x/r:0)*k;rig.position.z+=(r?W.z/r:1)*k}rig.updateMatrixWorld(true)}
const keys={};let yaw=0,pitch=0,drag=0,mv0=0,lx,ly;
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code=='KeyM')pinned=!pinned});addEventListener('keyup',e=>keys[e.code]=0);
R.domElement.addEventListener('pointerdown',e=>{drag=1;mv0=0;lx=e.clientX;ly=e.clientY});
addEventListener('pointermove',e=>{if(!drag||R.xr.isPresenting)return;const dx=e.clientX-lx,dy=e.clientY-ly;mv0+=Math.abs(dx)+Math.abs(dy);yaw-=dx*.004;pitch=Math.max(-1.3,Math.min(1.3,pitch-dy*.004));lx=e.clientX;ly=e.clientY});
addEventListener('pointerup',e=>{if(drag&&mv0<6&&!R.xr.isPresenting){rc.setFromCamera({x:e.clientX/innerWidth*2-1,y:-e.clientY/innerHeight*2+1},cam);const h=rc.intersectObjects(hits,false)[0];h&&h.object.userData.sel&&h.object.userData.sel()}drag=0});

/* ---------- VR SESSION ---------- */
const vr=$('vr');
if(navigator.xr)navigator.xr.isSessionSupported('immersive-vr').then(ok=>{vr.disabled=!ok;if(!ok)vr.textContent='VR not available (desktop preview)'});else vr.textContent='WebXR not supported (desktop preview)';
vr.onclick=async()=>{const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});R.xr.setReferenceSpaceType('local-floor');R.xr.setSession(s)};
R.xr.addEventListener('sessionstart',()=>$('ui').style.display='none');
R.xr.addEventListener('sessionend',()=>{$('ui').style.display='';cam.position.set(0,1.6,0);yaw=pitch=0;rig.rotation.y=0});

/* ---------- LOOP ---------- */
const clock=new T.Clock(),hp=new T.Vector3(),hq=new T.Quaternion(),lp=new T.Vector3(),lq=new T.Quaternion(),rp=new T.Vector3(),rq=new T.Quaternion(),du=new T.Object3D();let tt=0,fr=0;
R.setAnimationLoop(()=>{
 const dt=Math.min(clock.getDelta(),.05);tt+=dt;const xr=R.xr.isPresenting;
 if(xr){ctl.forEach(c=>{const i=c.userData.i;if(!i||!i.gamepad)return;const a=i.gamepad.axes,x=a[2]||a[0]||0,y=a[3]||a[1]||0;
  if(i.handedness=='left'){if(Math.hypot(x,y)>.15)mv(x,y,dt);const b=i.gamepad.buttons,p=[4,5,6].some(k=>b[k]&&b[k].pressed);if(p&&!pb)pinned=!pinned;pb=p}else if(i.handedness=='right'){if(Math.abs(x)>.7){if(!snap){snap=1;turn(-Math.sign(x)*PI/6)}}else snap=0}})}
 else{cam.rotation.set(pitch,yaw,0,'YXZ');rig.updateMatrixWorld(true);mv((keys.KeyD?1:0)-(keys.KeyA?1:0),(keys.KeyS?1:0)-(keys.KeyW?1:0),dt)}
 bound();
 orb.rotation.y=tt*.6;orb.rotation.x=tt*.3;hubL.lookAt(cam.getWorldPosition(W));arcs.forEach((a,i)=>a.rotation.z=tt*(i%2?-1:1)*(1+i*.2));
 // ray pointers + hover
 hov=null;ctl.forEach(c=>{const l=c.userData.l,h=c.userData.i?hit(c):null;l.visible=!!c.userData.i;l.scale.z=h?h.distance:2;if(h){hov=h.object;dot.position.copy(h.point)}});dot.visible=!!hov;
 hits.forEach(o=>{const t=(o.userData.b||1)*(o===hov?1.12:1);o.scale.setScalar(o.scale.x+(t-o.scale.x)*.25)});
 // local avatar
 cam.getWorldPosition(hp);cam.getWorldQuaternion(hq);let L=null,Rr=null;
 ctl.forEach(c=>{const h=c.userData.i&&c.userData.i.handedness;if(h=='left')L=c;else if(h=='right')Rr=c});
 if(L){L.getWorldPosition(lp);L.getWorldQuaternion(lq)}if(Rr){Rr.getWorldPosition(rp);Rr.getWorldQuaternion(rq)}
 me.up(hp,hq,L&&lp,lq,Rr&&rp,rq,dt);
 if(!(fr&127))me.clock();
 // wrist menu: opens when you look at the watch face, or toggles with the left-hand button (M on desktop)
 me.watch.updateWorldMatrix(true,false);me.watch.getWorldPosition(wp);wn.set(0,1,0).applyQuaternion(me.watch.getWorldQuaternion(wq));cam.getWorldDirection(fw);
 tv.copy(wp).sub(hp);const wd=tv.length();tv.divideScalar(wd||1);
 gz=wd<.8&&tv.dot(fw)>.93&&wn.dot(tv)<-.3?.5:Math.max(0,gz-dt);
 mk+=((pinned||gz>0?1:0)-mk)*Math.min(1,dt*10);menu.visible=mk>.03;menu.scale.setScalar(Math.max(mk,.001));
 if(menu.visible){tv.copy(wp);tv.y+=.22;if(mk<.15)menu.position.copy(tv);else menu.position.lerp(tv,Math.min(1,dt*14));menu.lookAt(hp)}
 // demo friends (stand-ins until multiplayer)
 bots.forEach((b,i)=>{const p=new T.Vector3(b.x,1.62+Math.sin(tt*1.5+i)*.01,b.z),q=new T.Vector3(2*p.x-hp.x,p.y+Math.max(-.3,Math.min(.3,hp.y-p.y)),2*p.z-hp.z);
