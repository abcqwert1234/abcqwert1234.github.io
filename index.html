<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ringside – VR boxing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap">
<style>
:root{--ink:#14100d;--canvas:#e9e2d3;--amber:#e8a33d;--red:#c0392b;--blue:#2f6fb0}
html,body{margin:0;height:100%;background:var(--ink);color:var(--canvas);font-family:"Oswald","Arial Narrow",Impact,sans-serif}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,rgba(232,163,61,.18),transparent 60%)}
#ui>*{pointer-events:auto}
#ui.hidden{display:none}
#ui.compact{justify-content:flex-start;background:none}
#ui.compact h1,#ui.compact p{display:none}
h1{margin:0;font-size:clamp(48px,12vw,112px);line-height:.9;font-weight:700;letter-spacing:.01em}
p{margin:0;max-width:34ch;font-family:system-ui,sans-serif;font-size:16px;line-height:1.5;opacity:.85}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
input,button{font:inherit;font-size:20px;padding:12px 20px;border-radius:6px;border:2px solid var(--canvas);background:transparent;color:var(--canvas)}
input{width:9ch;text-align:center}
button{cursor:pointer;background:var(--canvas);color:var(--ink);font-weight:700}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#status{min-height:1.5em;font-family:system-ui,sans-serif;font-size:15px;color:var(--amber)}
</style>
</head>
<body>
<div id="ui">
  <h1>Ringside</h1>
  <p>Two players, one room code. Share the link, then step into the ring.</p>
  <div class="row">
    <input id="room" aria-label="Room code" maxlength="12" value="ring1">
    <button id="join">Join room</button>
    <button id="offline">Offline test</button>
    <button id="vr" disabled>Enter VR</button>
  </div>
  <div id="status" role="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const V3 = THREE.Vector3;

// ---------- state ----------
let ws = null, slot = -1, peers = 0, over = false, offline = false;
let hp = [100, 100], msg = 'Join a room to start';
const HALF = 2.4, SPAWN_Z = 1.3;

// ---------- renderer / scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14100d);
scene.fog = new THREE.Fog(0x14100d, 8, 22);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 50);
camera.position.y = 1.6;
const rig = new THREE.Group();           // the player's "body"; moved to the spawn corner
rig.add(camera); scene.add(rig);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.domElement.style.cssText = 'position:fixed;inset:0';
document.body.prepend(renderer.domElement);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// lights: warm gym lamps over the ring
scene.add(new THREE.HemisphereLight(0x8a7a66, 0x1a1410, 0.7));
[[-1.6, -1.6], [1.6, -1.6], [-1.6, 1.6], [1.6, 1.6]].forEach(([x, z]) => {
  const l = new THREE.PointLight(0xffc27a, 0.9, 9); l.position.set(x, 3.2, z); scene.add(l);
});

// ring
const mat = (c, r = 0.8) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
const platform = new THREE.Mesh(new THREE.BoxGeometry(HALF * 2, 0.3, HALF * 2), mat(0xe9e2d3, 0.95));
platform.position.y = -0.15; scene.add(platform);
const apron = new THREE.Mesh(new THREE.CircleGeometry(14, 48), mat(0x1b1612, 1));
apron.rotation.x = -Math.PI / 2; apron.position.y = -0.31; scene.add(apron);

const corners = [[-HALF, HALF], [HALF, HALF], [HALF, -HALF], [-HALF, -HALF]];
corners.forEach(([x, z]) => {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.4, 12), mat(z > 0 ? 0x8f2a20 : 0x24507f, 0.5));
  post.position.set(x, 0.7, z); scene.add(post);
});
function rope(a, b, y) {
  const A = new V3(a[0], y, a[1]), B = new V3(b[0], y, b[1]);
  const dir = B.clone().sub(A), len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, len, 8), mat(0xe9e2d3, 0.6));
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new V3(0, 1, 0), dir.normalize());
  scene.add(m);
}
[0.55, 0.85, 1.15].forEach(y => corners.forEach((c, i) => rope(c, corners[(i + 1) % 4], y)));

// scoreboard (same texture on two boards so each fighter sees one behind their opponent)
const hc = document.createElement('canvas'); hc.width = 1024; hc.height = 256;
const hx = hc.getContext('2d');
const hudTex = new THREE.CanvasTexture(hc);
const boardMat = new THREE.MeshBasicMaterial({ map: hudTex });
[[-3.6, 0], [3.6, Math.PI]].forEach(([z, ry]) => {
  const b = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 0.8), boardMat);
  b.position.set(0, 2.3, z); b.rotation.y = ry; scene.add(b);
});
function drawHUD() {
  hx.fillStyle = '#14100d'; hx.fillRect(0, 0, 1024, 256);
  hx.font = '700 38px Oswald, Impact, sans-serif'; hx.textBaseline = 'alphabetic';
  const bar = (x, w, val, col, label, right) => {
    hx.fillStyle = '#2a221b'; hx.fillRect(x, 70, w, 44);
    hx.fillStyle = col; const fw = w * Math.max(0, val) / 100;
    hx.fillRect(right ? x + w - fw : x, 70, fw, 44);
    hx.fillStyle = '#e9e2d3'; hx.textAlign = right ? 'right' : 'left';
    hx.fillText(label, right ? x + w : x, 52);
  };
  bar(40, 440, hp[0], '#c0392b', 'Red corner' + (slot === 0 ? ' (you)' : ''), false);
  bar(544, 440, hp[1], '#2f6fb0', 'Blue corner' + (slot === 1 ? ' (you)' : ''), true);
  hx.fillStyle = '#e8a33d'; hx.textAlign = 'center'; hx.font = '700 64px Oswald, Impact, sans-serif';
  hx.fillText(msg, 512, 205);
  hudTex.needsUpdate = true;
}
drawHUD();

// ---------- boxers ----------
function makeBoxer(color) {
  const g = new THREE.Group(); scene.add(g);
  const m = () => new THREE.MeshStandardMaterial({ color, roughness: 0.6, emissive: 0x000000 });
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.11, 20, 16), m());
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.55, 0.22), m());
  const gl = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), m());
  const gr = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), m());
  [head, torso, gl, gr].forEach(o => g.add(o));
  g.visible = false;
  return { g, head, torso, gl, gr, t: null, flash: 0 };
}
const remote = makeBoxer(0xb04a3a);
const _e = new THREE.Euler();
function updateRemote(dt) {
  remote.g.visible = peers === 2;
  const t = remote.t; if (!t) return;
  // objects live in world space inside the group (group stays at origin)
  remote.head.position.lerp(t.hp, 0.5); remote.head.quaternion.slerp(t.hq, 0.5);
  _e.setFromQuaternion(remote.head.quaternion, 'YXZ');
  remote.torso.position.set(remote.head.position.x, remote.head.position.y - 0.45, remote.head.position.z);
  remote.torso.rotation.set(0, _e.y, 0);
  remote.gl.position.lerp(t.l, 0.5); remote.gr.position.lerp(t.r, 0.5);
  remote.flash = Math.max(0, remote.flash - dt);
  remote.head.material.emissive.setHex(remote.flash > 0 ? 0xff2200 : 0x000000);
}

// local gloves attached to the controllers (rig child, so they follow the spawn)
const controllers = [0, 1].map(i => {
  const c = renderer.xr.getController(i);
  c.add(new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), mat(0xc0392b, 0.5)));
  c.addEventListener('connected', e => { c.userData.gp = e.data.gamepad; });
  rig.add(c);
  return c;
});
function buzz(c, s, ms) {
  const g = c.userData.gp; if (!g) return;
  try {
    if (g.hapticActuators && g.hapticActuators[0]) g.hapticActuators[0].pulse(s, ms);
    else if (g.vibrationActuator) g.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: s, weakMagnitude: s });
  } catch (e) {}
}

// ---------- punch detection ----------
const prev = [new V3(), new V3()], seen = [false, false], cool = [0, 0];
const p = new V3(), torsoP = new V3();
function punchCheck(dt) {
  if (dt <= 0) return;
  controllers.forEach((c, i) => {
    c.getWorldPosition(p);
    const speed = seen[i] ? p.distanceTo(prev[i]) / dt : 0;
    prev[i].copy(p); seen[i] = true; cool[i] -= dt;
    if (slot < 0 || over || peers < 2 || speed < 2 || cool[i] > 0) return;
    const oh = remote.head.position;
    torsoP.set(oh.x, oh.y - 0.45, oh.z);
    let zone = null;
    if (p.distanceTo(oh) < 0.27) zone = 'head';
    else if (p.distanceTo(torsoP) < 0.3) zone = 'body';
    if (!zone) return;
    // opponent guarding their face with a glove reduces damage
    const guarded = remote.gl.position.distanceTo(oh) < 0.3 || remote.gr.position.distanceTo(oh) < 0.3;
    let dmg = Math.min(14, speed * 2.2) * (zone === 'body' ? 0.6 : 1) * (guarded ? 0.25 : 1);
    cool[i] = 0.4;
    send({ t: 'hit', dmg: +dmg.toFixed(1) });
    buzz(c, Math.min(1, speed / 6), 80);
    remote.flash = 0.15;
  });
}

// ---------- networking ----------
function send(m) {
  if (offline) { if (m.t === 'hit') offlineHit(m.dmg); return; }
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(m));
}
const _q = new THREE.Quaternion(), _p = new V3(), _l = new V3(), _r = new V3();
const r3 = v => [+v.x.toFixed(3), +v.y.toFixed(3), +v.z.toFixed(3)];
function sendPose() {
  if (slot < 0 || peers < 2) return;
  camera.getWorldPosition(_p); camera.getWorldQuaternion(_q);
  controllers[0].getWorldPosition(_l); controllers[1].getWorldPosition(_r);
  send({ t: 'pose', p: [...r3(_p), +_q.x.toFixed(3), +_q.y.toFixed(3), +_q.z.toFixed(3), +_q.w.toFixed(3), ...r3(_l), ...r3(_r)] });
}
function applyPose(a) {
  if (!remote.t) {
    remote.t = { hp: new V3(), hq: new THREE.Quaternion(), l: new V3(), r: new V3() };
    remote.head.position.set(a[0], a[1], a[2]); remote.gl.position.set(a[7], a[8], a[9]); remote.gr.position.set(a[10], a[11], a[12]);
  }
  remote.t.hp.set(a[0], a[1], a[2]); remote.t.hq.set(a[3], a[4], a[5], a[6]);
  remote.t.l.set(a[7], a[8], a[9]); remote.t.r.set(a[10], a[11], a[12]);
}
function setStatus(s) { $('status').textContent = s; }

function connect() {
  const room = ($('room').value || 'ring1').trim();
  history.replaceState(null, '', '?room=' + encodeURIComponent(room));
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/?room=' + encodeURIComponent(room));
  setStatus('Connecting…'); $('join').disabled = true;
  ws.onopen = () => setStatus('Connected. Waiting for an opponent…');
  ws.onclose = () => { setStatus('Disconnected. Join again to reconnect.'); $('join').disabled = false; slot = -1; peers = 0; msg = 'Disconnected'; drawHUD(); };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.t === 'init') {
      slot = m.slot; hp = m.hp;
      rig.position.set(0, 0, slot === 0 ? SPAWN_Z : -SPAWN_Z);
      rig.rotation.y = slot === 0 ? 0 : Math.PI;     // both fighters face the centre
      msg = 'Waiting for opponent'; drawHUD();
      $('vr').disabled = false;
      setStatus('You are the ' + (slot === 0 ? 'red' : 'blue') + ' corner. Put on your headset and press Enter VR.');
      setLook();
    } else if (m.t === 'full') { setStatus('That room is full. Try another code.');
    } else if (m.t === 'peer') {
      peers = m.n; if (peers < 2) remote.t = null;
      msg = peers === 2 ? 'Fight!' : 'Waiting for opponent'; over = false; drawHUD();
    } else if (m.t === 'pose') { applyPose(m.p);
    } else if (m.t === 'hp') {
      hp = m.hp; drawHUD();
      if (m.victim === slot) controllers.forEach(c => buzz(c, 0.9, 140));
    } else if (m.t === 'ko') {
      over = true; msg = m.winner === slot ? 'You win!' : 'Knocked out'; drawHUD();
    } else if (m.t === 'reset') { over = false; msg = 'Fight!'; drawHUD(); }
  };
}

// ---------- offline test mode (no server) ----------
function setLook() {
  const mine = slot === 0 ? 0x24507f : 0x8f2a20;      // opponent's colour
  remote.head.material.color.setHex(mine); remote.torso.material.color.setHex(mine);
  remote.gl.material.color.setHex(mine); remote.gr.material.color.setHex(mine);
  controllers.forEach(c => c.children[0].material.color.setHex(slot === 0 ? 0xc0392b : 0x2f6fb0));
}
const bot = { t: 0, next: 2, punch: -1, hit: false };
const botQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.PI, 0)); // faces the player
const _hd = new V3(), _cp = new V3(), _tg = new V3();
let resetAt = 0;
function endOffline(m) { over = true; msg = m; drawHUD(); resetAt = performance.now() + 4000; }
function offlineHit(dmg) {
  if (over) return;
  hp[1] = Math.max(0, hp[1] - dmg); drawHUD();
  if (hp[1] <= 0) endOffline('You win!');
}
function deskMode(on) {      // lets mouse code drive the gloves when no headset session is running
  if (!offline) return;
  controllers.forEach(c => { c.matrixAutoUpdate = on; if (on) c.visible = true; });
}
function startOffline() {
  offline = true; slot = 0; peers = 2; over = false; hp = [100, 100]; msg = 'Fight!';
  rig.position.set(0, 0, SPAWN_Z); rig.rotation.y = 0;
  setLook(); drawHUD(); deskMode(true);
  remote.t = { hp: new V3(0, 1.6, 0.45), hq: botQ.clone(), l: new V3(-0.15, 1.48, 0.3), r: new V3(0.15, 1.48, 0.3) };
  remote.head.position.copy(remote.t.hp); remote.head.quaternion.copy(botQ);
  remote.gl.position.copy(remote.t.l); remote.gr.position.copy(remote.t.r);
  $('vr').disabled = false; $('offline').disabled = true; $('join').disabled = true;
  $('ui').classList.add('compact');
  setStatus('Offline test: a sparring bot stands 1 m away. Press Enter VR, or use the mouse (move to aim, click to jab).');
}
function botUpdate(dt) {
  if (!offline) return;
  if (over && performance.now() > resetAt) { over = false; hp = [100, 100]; msg = 'Fight!'; drawHUD(); }
  bot.t += dt;
  const t = remote.t, s = bot.t, bob = Math.sin(s * 3) * 0.02;
  t.hp.set(Math.sin(s * 1.3) * 0.15, 1.6 + Math.sin(s * 2.1) * 0.03, 0.45);
  t.l.set(t.hp.x - 0.13, 1.48 + bob, 0.3); t.r.set(t.hp.x + 0.13, 1.48 - bob, 0.3);
  if (over) return;
  bot.next -= dt;
  if (bot.punch < 0 && bot.next <= 0) { bot.punch = 0; bot.hit = false; bot.next = 1.8 + Math.random() * 1.8; }
  if (bot.punch >= 0) {
    bot.punch += dt / 0.3;
    const k = Math.sin(Math.min(bot.punch, 1) * Math.PI);        // out and back
    camera.getWorldPosition(_hd);
    _tg.copy(_hd); _tg.z -= 0.15;
    t.r.lerp(_tg, k);
    if (k > 0.9 && !bot.hit && t.r.distanceTo(_hd) < 0.3) {
      bot.hit = true;
      const blocked = controllers.some(c => (c.getWorldPosition(_cp), _cp.distanceTo(_hd) < 0.3));
      hp[0] = Math.max(0, hp[0] - (blocked ? 1.5 : 6)); drawHUD();
      controllers.forEach(c => buzz(c, blocked ? 0.3 : 0.9, blocked ? 60 : 140));
      if (hp[0] <= 0) endOffline('Knocked out');
    }
    if (bot.punch >= 1) bot.punch = -1;
  }
}
// desktop fallback: mouse aims the right glove, click throws a jab
const mouse = { x: 0, y: 0, jab: 0 };
addEventListener('mousemove', e => { mouse.x = e.clientX / innerWidth * 2 - 1; mouse.y = -(e.clientY / innerHeight * 2 - 1); });
renderer.domElement.addEventListener('mousedown', () => { if (offline && !renderer.xr.isPresenting) mouse.jab = 1; });
function mouseGlove(dt) {
  if (!offline || renderer.xr.isPresenting) return;
  mouse.jab = Math.max(0, mouse.jab - dt / 0.14);
  const j = mouse.jab > 0 ? Math.sin((1 - mouse.jab) * Math.PI) : 0;
  controllers[1].position.set(mouse.x * 0.4, 1.25 + mouse.y * 0.35, -0.35 - 0.9 * j);
  controllers[0].position.set(-0.2, 1.3, -0.3);
}

// ---------- UI / XR session ----------
$('offline').onclick = startOffline;
$('join').onclick = connect;
$('room').value = new URLSearchParams(location.search).get('room') || 'ring1';
if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-vr').then(ok => { if (!ok) setStatus('WebXR VR is not available in this browser. Use a headset browser such as Meta Quest Browser.'); });
} else setStatus('WebXR is not available here. Open this page in a headset browser over HTTPS.');
$('vr').onclick = async () => {
  try {
    const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
    await renderer.xr.setSession(s);
  } catch (e) { setStatus('Could not start VR: ' + e.message); }
};
renderer.xr.addEventListener('sessionstart', () => { $('ui').classList.add('hidden'); deskMode(false); });
renderer.xr.addEventListener('sessionend', () => { $('ui').classList.remove('hidden'); deskMode(true); });

// ---------- loop ----------
let last = performance.now(), netT = 0;
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min((now - last) / 1000, 0.1); last = now;
  mouseGlove(dt); punchCheck(dt); botUpdate(dt); updateRemote(dt);
  netT += dt; if (netT > 0.05) { netT = 0; sendPose(); }   // ~20 Hz
  renderer.render(scene, camera);
});
})();
</script>
</body>
</html>
